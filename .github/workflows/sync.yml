name: Sync version indexes
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-version-indexes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata parsing
        run: python3 -m unittest discover -s tests
      - name: Sync upstream metadata
        run: python3 scripts/sync.py
      - name: Generate and validate pages
        run: |
          python3 scripts/generate.py
          python3 scripts/validate.py
          git diff --check
      - name: Commit changed indexes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name 'watchdb'
          git config user.email 'ysj0109@gmail.com'
          git add data android macos README.md
          git commit -m "Update WeChat version indexes from upstream metadata"
          git push
